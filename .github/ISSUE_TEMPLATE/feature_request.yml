name: Feature request
description: Describe a problem that Postbag could help solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where the current four commands fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Explain how it fits two peers, one ledger, and a human-set letter budget.
