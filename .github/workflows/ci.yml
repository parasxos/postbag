name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and local transport tests
        run: python -m pytest -q
      - name: Check source entry points
        run: |
          ./postbag --version
          python -m postbag --help

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build and check package metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and source archive in fresh environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-install"
          "$RUNNER_TEMP/wheel-install/bin/python" -m pip install dist/*.whl
          python -m venv "$RUNNER_TEMP/sdist-install"
          "$RUNNER_TEMP/sdist-install/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          wheel-install/bin/postbag --version
          wheel-install/bin/postbag --help
          sdist-install/bin/postbag --version
          sdist-install/bin/postbag --help
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
